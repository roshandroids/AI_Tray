# Lefthook — local DX hooks (optional per clone).
# Calls the same ./scripts/* surface as GitHub Actions Quality CI.
#
# Enable once per clone:
#   brew install lefthook
#   lefthook install
#
# See docs/devops/LOCAL_DEVELOPMENT.md
# Note: CI_MODE in .ci/config does not affect GitHub Actions.

min_version: 1.5.0

pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{dart}"
      run: bash scripts/format.sh
    analyze:
      glob: "*.{dart}"
      run: bash scripts/analyze.sh
    quick-tests:
      glob: "*.{dart}"
      run: bash scripts/test.sh

commit-msg:
  commands:
    conventional:
      run: bash scripts/ci/check_conventional_commit.sh {1}

pre-push:
  parallel: false
  commands:
    unit-tests:
      run: bash scripts/test.sh
    bridge-check:
      run: bash scripts/ci/bridge.sh
    handoff:
      run: bash scripts/ci/validate_handoff.sh
