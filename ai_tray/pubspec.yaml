name: ai_tray
description: Native desktop companion for Claude Code usage (macOS menu bar / Windows tray).
publish_to: "none"
version: 1.3.2+8

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  meta: ^1.17.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon_32.png
    - assets/tray/tray_icon.ico
    - assets/tray/tray_icon_live.png
    - assets/tray/tray_icon_cached.png
    - assets/tray/tray_icon_error.png
    - assets/tray/tray_icon_refreshing.png
    - assets/tray/tray_icon_waiting.png
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.otf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.otf
          weight: 600
