name: ai_tray
description: Native desktop companion for Claude Code usage (macOS menu bar / Windows tray).
publish_to: "none"
version: 1.0.0-rc.1+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  meta: ^1.17.0
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/tray_icon_32.png
    - assets/tray/tray_icon.ico
