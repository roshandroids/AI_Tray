name: ai_tray
description: Native desktop companion for Claude Code usage (macOS menu bar / Windows tray).
publish_to: "none"
version: 1.3.3+9

environment:
  sdk: ^3.10.8

dependencies:
  flex_color_scheme: ^8.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  meta: ^1.17.0
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/release_history.json
    - assets/tray/tray_icon_32.png
    - assets/tray/tray_icon.ico
    - assets/tray/tray_menubar_template.png
    - assets/tray/tray_menubar_template_16.png
    - assets/tray/tray_menubar_template_18.png
    - assets/tray/tray_menubar_template_36.png
    - assets/tray/tray_menubar_template_dim.png
    - assets/tray/tray_menubar_template_dim_36.png
    - assets/tray/tray_icon_live.png
    - assets/tray/tray_icon_cached.png
    - assets/tray/tray_icon_error.png
    - assets/tray/tray_icon_refreshing.png
    - assets/tray/tray_icon_waiting.png
    - assets/app_icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraCode-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.otf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.otf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.otf
          weight: 600
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
