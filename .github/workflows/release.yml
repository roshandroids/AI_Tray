name: Release

# macOS + Windows via platform-ci (tag / manual only). Never on PR.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          PUBSPEC_VERSION=$(grep -E '^version:' ai_tray/pubspec.yaml | awk '{print $2}')
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
          if [ "$PUBSPEC_NAME" != "$VERSION" ]; then
            echo "::error::pubspec ($PUBSPEC_NAME) must match tag ($VERSION)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    # Pinned to the commit tag v1 resolved to on 2026-08-05. Bump deliberately:
    # resolve the new SHA for the tag you want, don't just move to @v1.
    uses: roshandroids/platform-ci/.github/workflows/build.yml@143c92a533dedc33487ef4cee28091d8cc078570
    with:
      config-path: ci.yaml
      trigger: release
      sha: ${{ needs.validate.outputs.sha }}

  release:
    needs: [validate, build]
    # Pinned past the commit that fixed an invalid on.workflow_call.permissions
    # (permissions must be top-level in a reusable workflow, not nested there).
    uses: roshandroids/platform-ci/.github/workflows/release.yml@143c92a533dedc33487ef4cee28091d8cc078570
    with:
      config-path: ci.yaml
      tag: ${{ needs.validate.outputs.tag }}
      artifact-sha: ${{ needs.validate.outputs.sha }}
    permissions:
      contents: write
