name: Release

# Triggered by version tags (vX.Y.Z or vX.Y.Z-prerelease).
# Validates pubspec version, builds desktop artifacts, publishes GitHub Release.
# Manual fallback: workflow_dispatch with tag input.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.9"
  WORKING_DIRECTORY: ai_tray
  APP_NAME: "AI Tray"

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag must match vX.Y.Z or vX.Y.Z-prerelease (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (version $VERSION)"

      - name: Verify pubspec version matches tag
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          PUBSPEC_VERSION=$(grep -E '^version:' ai_tray/pubspec.yaml | awk '{print $2}')
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
          if [ "$PUBSPEC_NAME" != "$VERSION" ]; then
            echo "::error::pubspec version name ($PUBSPEC_NAME) must match tag ($VERSION)"
            echo "Run scripts/release/publish.sh before tagging, or fix pubspec.yaml"
            exit 1
          fi
          echo "pubspec version $PUBSPEC_VERSION matches tag $TAG"

  build-macos-arm64:
    name: Build macOS arm64
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ai_tray
        run: flutter pub get

      - name: Build macOS arm64 (release)
        working-directory: ai_tray
        run: flutter build macos --release

      - name: Package macOS arm64
        run: |
          cd ai_tray/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "AI Tray.app" \
            "${{ github.workspace }}/AI-Tray-macOS-arm64.zip"

      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Tray-macOS-arm64
          path: AI-Tray-macOS-arm64.zip
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS x64
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ai_tray
        run: flutter pub get

      # GitHub macOS runners are Apple Silicon; Rosetta builds an x64 .app.
      - name: Build macOS x64 (release)
        working-directory: ai_tray
        run: arch -x86_64 flutter build macos --release

      - name: Package macOS x64
        run: |
          cd ai_tray/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "AI Tray.app" \
            "${{ github.workspace }}/AI-Tray-macOS-x64.zip"

      - name: Upload macOS x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Tray-macOS-x64
          path: AI-Tray-macOS-x64.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ai_tray
        run: flutter pub get

      - name: Build Windows (release)
        working-directory: ai_tray
        run: flutter build windows --release

      - name: Package Windows x64
        shell: pwsh
        run: |
          $releaseDir = "ai_tray/build/windows/x64/runner/Release"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "AI-Tray-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Tray-Windows-x64
          path: AI-Tray-Windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build-macos-arm64
      - build-macos-x64
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets/

      - name: Extract changelog section
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          NOTES=$(bash scripts/release/extract_changelog.sh "$VERSION" || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION. See CHANGELOG.md for details."
          fi
          {
            echo "body<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: AI Tray ${{ needs.validate.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          files: |
            release-assets/AI-Tray-macOS-arm64.zip
            release-assets/AI-Tray-macOS-x64.zip
            release-assets/AI-Tray-Windows-x64.zip
          generate_release_notes: false
