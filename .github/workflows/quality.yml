name: Quality

# =============================================================================
# Quality CI (EP-004A / Quality CI + Release CD)
# =============================================================================
# Thin orchestration: invokes ./scripts/*.sh (same commands as local DX).
# Toolchain pins: .ci/toolchain.env (via scripts/ci/export_toolchain.sh)
# GitHub Actions IGNORES .ci/config CI_MODE — always runs these checks.
#
# STABLE CHECK CONTEXTS (branch protection / rulesets):
#   Format | Analyze | Test | Validate workflows
# =============================================================================
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'ai_tray/**'
              - 'lefthook.yml'
              - 'scripts/**'
              - '.ci/**'
            workflows:
              - '.github/workflows/**'

  format:
    name: Format
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip Flutter (no code paths)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code/scripts changes — skipping format."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Load toolchain pins
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/ci/export_toolchain.sh

      - name: Set up Flutter
        if: needs.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('ai_tray/pubspec.lock') }}

      - name: Format
        if: needs.changes.outputs.code == 'true'
        run: bash ./scripts/format.sh

  analyze:
    name: Analyze
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip Flutter (no code paths)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code/scripts changes — skipping analyze."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Load toolchain pins
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/ci/export_toolchain.sh

      - name: Set up Flutter
        if: needs.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('ai_tray/pubspec.lock') }}

      - name: Analyze
        if: needs.changes.outputs.code == 'true'
        run: bash ./scripts/analyze.sh

  test:
    name: Test
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip Flutter (no code paths)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code/scripts changes — skipping tests."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Load toolchain pins
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/ci/export_toolchain.sh

      - name: Set up Flutter
        if: needs.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('ai_tray/pubspec.lock') }}

      - name: Set up pinned Node
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai_tray/tool/copilot_sdk_bridge/package-lock.json

      - name: Bridge check
        if: needs.changes.outputs.code == 'true'
        run: bash ./scripts/ci/bridge.sh

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: bash ./scripts/test.sh

  validate-workflows:
    name: Validate workflows
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip (no workflow changes)
        if: needs.changes.outputs.workflows != 'true' && needs.changes.outputs.code != 'true'
        run: echo "No workflow/code changes — skipping workflow YAML parse."

      - name: Checkout
        if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.code == 'true'
        uses: actions/checkout@v4

      - name: Validate workflows
        if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.code == 'true'
        run: bash ./scripts/check.sh workflows
