name: Quality

# platform-ci — ubuntu quality only (no desktop on PR/push).
# Required check context: quality / Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: roshandroids/platform-ci/.github/workflows/quality.yml@v1
    with:
      config-path: ci.yaml
