name: Release PR

# Prove shipability on release/* only (quality + desktop builds).
on:
  pull_request:
    branches: [main]

concurrency:
  group: release-pr-${{ github.repository }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: startsWith(github.head_ref, 'release/')
    # Pinned to the commit tag v1 resolved to on 2026-08-02. Bump deliberately:
    # resolve the new SHA for the tag you want, don't just move to @v1.
    uses: roshandroids/platform-ci/.github/workflows/quality.yml@ae93a81f35e088ccd8026557d27cb95e24b3fd12
    with:
      config-path: ci.yaml

  build:
    if: startsWith(github.head_ref, 'release/')
    needs: quality
    # Pinned to the same resolved commit as the quality job above.
    uses: roshandroids/platform-ci/.github/workflows/build.yml@ae93a81f35e088ccd8026557d27cb95e24b3fd12
    with:
      config-path: ci.yaml
      trigger: release
      sha: ${{ github.sha }}
