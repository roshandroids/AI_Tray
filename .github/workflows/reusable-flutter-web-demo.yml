name: Reusable Flutter Web Demo

# Callable-only template for other RSProjects that ship Flutter Web demos.
# AI Tray does NOT call this (Quality CI + Release CD; product-as-demo — see
# docs/devops/DEMO_STRATEGY.md / PD-025). Zero Actions minutes unless invoked.
# Ubuntu only. Not part of AI Tray PR/push/release paths.
#
# Example caller:
#   jobs:
#     build-demo:
#       uses: ./.github/workflows/reusable-flutter-web-demo.yml
#       with:
#         working_directory: examples/rich_text_editor_demo
#         demo_id: rich_text_editor

on:
  workflow_call:
    inputs:
      working_directory:
        description: Path to the Flutter demo app (directory with pubspec.yaml)
        required: true
        type: string
      demo_id:
        description: Stable demo id (used in artifact name)
        required: true
        type: string
      flutter_version:
        description: Flutter SDK version (stable channel)
        required: false
        type: string
        default: "3.38.9"
      base_href:
        description: Optional --base-href for flutter build web
        required: false
        type: string
        default: "/"
      run_tests:
        description: Run flutter test before build
        required: false
        type: boolean
        default: true
    outputs:
      artifact_name:
        description: Uploaded artifact name
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:
  build:
    name: Build ${{ inputs.demo_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve artifact name
        id: meta
        run: echo "artifact_name=flutter-web-demo-${{ inputs.demo_id }}" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Enable web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ inputs.working_directory }}
        run: flutter analyze --fatal-infos

      - name: Test
        if: inputs.run_tests
        working-directory: ${{ inputs.working_directory }}
        run: flutter test

      - name: Build web
        working-directory: ${{ inputs.working_directory }}
        run: flutter build web --release --base-href "${{ inputs.base_href }}"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ inputs.working_directory }}/build/web
          if-no-files-found: error
          retention-days: 14
