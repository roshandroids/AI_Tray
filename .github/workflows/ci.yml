name: CI

# Protected-main workflow (CELPIP / MBO house convention):
#   feature/* → Pull Request → Format / Analyze / Test (+ Build macOS)
#   push to main → Format / Analyze / Test only (no artifact build)
#   Publish / desktop artifacts → Release workflow (version tags or workflow_dispatch)
#
# STABLE CHECK CONTEXTS (branch protection / rulesets):
#   Format | Analyze | Test | Build macOS
# Job `name:` below IS the GitHub status check name — do not rename without
# updating branch protection. See docs/release/CI-CD.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.9"
  NODE_VERSION: "22.17.0"
  NPM_VERSION: "10.9.2"
  WORKING_DIRECTORY: ai_tray

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai_tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai_tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai_tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai_tray/tool/copilot_sdk_bridge/package-lock.json

      - name: Build and test Copilot bridge
        working-directory: ai_tray/tool/copilot_sdk_bridge
        run: |
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"
          npm ci
          npm run check

      - name: Install dependencies
        run: flutter pub get

      - name: Test (unit + widget, excluding macOS goldens)
        run: flutter test --exclude-tags golden,screenshot

  build-macos:
    name: Build macOS
    # Skip expensive release-style builds on push to main; publish via release.yml.
    if: github.event_name == 'pull_request'
    needs: [format, analyze, test]
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai_tray
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: arm64
          cache: npm
          cache-dependency-path: ai_tray/tool/copilot_sdk_bridge/package-lock.json

      - name: Build and assemble Copilot sidecar
        working-directory: ai_tray/tool/copilot_sdk_bridge
        run: |
          test "$(npm --version)" = "${{ env.NPM_VERSION }}"
          npm ci
          npm run check
          node scripts/assemble_sidecar.mjs --target macos-arm64
          node scripts/verify_payload.mjs ../../build/copilot_sdk/macos-arm64
          node scripts/smoke_protocol.mjs ../../build/copilot_sdk/macos-arm64

      - name: Install dependencies
        run: flutter pub get

      - name: Golden tests (macOS renderer)
        run: flutter test --tags golden

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Verify packaged Copilot sidecar
        run: >-
          node tool/copilot_sdk_bridge/scripts/verify_payload.mjs
          "build/macos/Build/Products/Release/AI Tray.app/Contents/Resources/copilot_sdk"

